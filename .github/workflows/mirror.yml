name: Mirror pgvector to GHCR

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Upstream Docker Hub tag to mirror
        required: false
        default: pg17
  schedule:
    # Weekly refresh so the mirror keeps picking up upstream patch rebuilds.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SOURCE_IMAGE: pgvector/pgvector
  TARGET_IMAGE: ghcr.io/vm0-ai/pg17

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin to the digest before copying so a concurrent upstream retag cannot
      # split the source index across the tags we publish below.
      - name: Resolve upstream digest
        id: source
        run: |
          set -euo pipefail
          tag="${{ inputs.source_tag || 'pg17' }}"
          digest=$(docker buildx imagetools inspect "${SOURCE_IMAGE}:${tag}" --format '{{ .Manifest.Digest }}')
          case "$digest" in
            sha256:*) ;;
            *) echo "failed to resolve upstream digest: '$digest'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved ${SOURCE_IMAGE}:${tag} -> ${digest}"

      - name: Copy multi-arch index to GHCR
        id: copy
        run: |
          set -euo pipefail
          src="${SOURCE_IMAGE}@${{ steps.source.outputs.digest }}"
          date_tag="${{ steps.source.outputs.tag }}-$(date -u +'%Y%m%d')"
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:${{ steps.source.outputs.tag }}" \
            --tag "${TARGET_IMAGE}:${date_tag}" \
            "$src"
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"

      - name: Verify the mirror matches upstream
        run: |
          set -euo pipefail
          mirrored=$(docker buildx imagetools inspect "${TARGET_IMAGE}:${{ steps.source.outputs.tag }}" --format '{{ .Manifest.Digest }}')
          echo "upstream: ${{ steps.source.outputs.digest }}"
          echo "mirror:   ${mirrored}"
          if [ "$mirrored" != "${{ steps.source.outputs.digest }}" ]; then
            echo "mirror digest does not match upstream" >&2
            exit 1
          fi
          {
            echo "### Mirrored \`${SOURCE_IMAGE}:${{ steps.source.outputs.tag }}\`"
            echo
            echo "- digest: \`${mirrored}\`"
            echo "- \`${TARGET_IMAGE}:${{ steps.source.outputs.tag }}\`"
            echo "- \`${TARGET_IMAGE}:${{ steps.copy.outputs.date_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
